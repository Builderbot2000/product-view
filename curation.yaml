# Taxonomy and hand curation for `pv report` (report-design.md D14-D16).
#
# areas:  the product areas issues are filed under. `keywords` file a cluster
#         nobody has curated yet: its keywords and title are matched against
#         them, and the area with the most hits wins (none: "other").
# roles:  who reads which areas. Each role gets its own page holding only the
#         issues in its areas; the hub shows every area.
# issues: per stream, keyed by the label shown. Each lists `anchors`, the
#         review ids that identify it. On every run, a cluster belongs to the
#         label whose anchor reviews it contains (most anchors wins), so the
#         curation survives re-clustering; cluster ids do not. Several clusters
#         matching one label are merged and counted once per review.
#
#   kind:  issue (actionable) | mood (no specific cause) | outcome (a
#          consequence, e.g. switching banks) | hide (left out)
#   areas: area ids; the first is where the hub files it.

areas:
  sign-in:   {name: "Sign-in & security", keywords: [login, log, sign, password, 2fa, verification, trusted, fingerprint, biometric, biometrics, locked, access, remember, card, security, permissions]}
  stability: {name: "Stability & performance", keywords: [crash, crashes, crashing, open, error, technical, difficulties, slow, load, update, updates, reinstall, uninstall, working]}
  devices:   {name: "Devices & install", keywords: [compatible, device, android, samsung, tablet, galaxy, grapheneos, download, install, root, nfc]}
  payments:  {name: "Payments & transfers", keywords: [transfer, transfers, etransfer, interac, deposit, cheque, cheques, payment, pay, bill, bills, credit, wallet, tap]}
  design:    {name: "UI & design", keywords: [design, interface, ui, layout, menu, button, navigation, redesign, old app, language, french, dark, mode, friendly]}
  investing: {name: "Investing", keywords: [investing, direct, investment, investments, trade]}
  budgeting: {name: "Budgeting & insights", keywords: [nomi, budget, budgets, insights, spending]}
  support:   {name: "Customer support", keywords: [service, customer, agent, branch, called, support]}

roles:
  design:   {name: "UI & design team", areas: [design]}
  identity: {name: "Sign-in & security team", areas: [sign-in]}
  payments: {name: "Payments team", areas: [payments, investing, budgeting]}
  platform: {name: "Engineering / QA: stability & devices", areas: [stability, devices]}
  support:  {name: "Support / CX", areas: [support, sign-in, payments]}

