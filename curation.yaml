# Areas and roles for `pv issues` and `pv report` (report-design.md D16).
#
# Nothing here is specific to one app (llm-trials.md decision 4): issue names
# and definitions come from the reviews themselves.
#
# areas: the product areas an issue can be filed under. When an issue is
#        formed, the model picks one of these for it, from the name and the
#        description, and the issue keeps that area. Changing this list only
#        affects issues formed afterwards.
# roles: who reads which areas. Each role gets its own page holding only the
#        issues in its areas; the hub shows every area. `charts: [versions]`
#        adds a chart of this period's issues by app version.

areas:
  sign-in:     {name: "Sign-in & account access",
                description: "signing in, passwords, two-step verification, identity checks, trusted devices, being locked out"}
  stability:   {name: "Stability & performance",
                description: "crashes, freezes, error messages, slowness, connection problems, the app failing to open"}
  install:     {name: "Install & updates",
                description: "downloading, installing and updating the app, update prompts, problems that start after an update"}
  devices:     {name: "Devices & compatibility",
                description: "phone models, tablets, operating systems and versions the app does or does not support"}
  ui:          {name: "UI & usability",
                description: "layout, navigation, finding things, readability, accessibility, dark mode, ads in the app"}
  security:    {name: "Privacy & security",
                description: "permissions, data use, fraud, unauthorized activity, security settings"}
  support:     {name: "Customer support",
                description: "contacting support, help channels, how problems are handled"}
  features:    {name: "Features",
                description: "the app's own functions, the things it exists to do"}

roles:
  design:   {name: "UI & design", areas: [ui]}
  identity: {name: "Sign-in & security", areas: [sign-in, security]}
  product:  {name: "Product features", areas: [features]}
  platform: {name: "Engineering / QA", areas: [stability, install, devices], charts: [versions]}
  support:  {name: "Support / CX", areas: [support, sign-in]}
