[project]
name = "product-view"
version = "0.1.0"
description = "Match Google Play reviews to the app topics each team follows, and report them to Confluence"
requires-python = ">=3.10"
dependencies = [
    "google-play-scraper>=1.2.7",
    # Translation and matching. `sentence-transformers` and `transformers` both pull
    # `torch`, which dominates the download: ~250 MB CPU wheel on Windows and
    # macOS, but plain PyPI on Linux resolves to the ~2.5 GB CUDA build. See
    # the README for the CPU-only index URL that keeps a Linux install sane.
    "numpy>=1.24",
    "scikit-learn>=1.3",          # matching's classifiers
    "sentence-transformers>=2.2",
    "transformers>=4.30",         # MarianMT, fr->en
    "sentencepiece>=0.1.99",      # MarianMT tokenizer
    "py3langid>=0.2",             # pure-Python language detection, ~2 MB
    "platformdirs>=3.0",          # model cache location, cross-platform
    "pyyaml>=6.0",                # config.yaml
]

[project.scripts]
pv = "product_view.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"product_view.matching" = ["acceptance/*"]
